<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>岗位关系交互验证</title></head><body><div id="root"></div><script type="module">
import {createKnowledgeGraph} from '/src/knowledge/model.mjs';
import {catalog,sampleContext,defaultDesign,generateProject} from '/src/generation/model.mjs';
const role=catalog[0],task=role.tasks[0];
const project=generateProject({context:sampleContext,role,task,abilities:task.abilities,design:defaultDesign(role,task),confirmed:true});
project.title='岗位关系交互验证项目';
const graph=createKnowledgeGraph(),point=graph.nodes.find(n=>n.name==='机器人轨迹编程');
project.stages[0].tasks[0].contents.push({id:'qa-knowledge',knowledgeNodeId:point.id,title:point.name,source:'knowledge',type:'知识点',scored:true});
// This QA document uses isolated, in-memory drafts and never edits user storage.
const stored=new Map([['ai-course-projects-v1',JSON.stringify([project])],['ai-course-knowledge-v1',JSON.stringify(graph)]]);
Object.defineProperty(window,'localStorage',{value:{getItem:k=>stored.get(k)??null,setItem:(k,v)=>stored.set(k,String(v))}});
await import('/src/main.jsx');
</script></body></html>
