<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 736" width="1440" height="736"><defs><linearGradient id="slide-background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15283f"/><stop offset="1" stop-color="#2b465c"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8aa74"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-weight:400;font-synthesis:none}.slide-title{font-weight:600}.arrow{fill:none;stroke:#c8aa74;stroke-width:2;marker-end:url(#arr)}.retry{stroke-dasharray:6 5}</style><rect width="1440" height="736" rx="16" fill="url(#slide-background)"/><path d="M1050 0H1440V230Z" fill="#638d9a" opacity=".08"/><path d="M1220 0H1440V130Z" fill="#e6be80" opacity=".08"/><rect x="58" y="28" width="5" height="60" rx="2" fill="#e6be80"/><text class="slide-title" x="80" y="53" font-size="27" fill="#fff7e8">项目任务实施流程</text><text x="80" y="87" font-size="17" fill="#d4e3ec">项目任务实施指南</text><text x="58" y="120" font-size="15" fill="#b6c9d8">按箭头完成各阶段任务，每一步保留过程记录与成果。</text><rect x="58" y="158" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="76" y="175" width="34" height="28" rx="7" fill="#f5ead5"/><text x="83" y="195" font-size="15" fill="#91682f">01</text><text x="122" y="195" font-size="18" fill="#24384c">明确任务与获取信息</text><text x="78" y="225" font-size="15" fill="#536276">• 阅读项目要求与任务说明</text><text x="78" y="250" font-size="15" fill="#536276">• 收集资料，明确问题与目标</text><path d="M76 283H458" stroke="#e4e1d9"/><text x="78" y="305" font-size="14" fill="#35776b">输出：问题清单与资料记录</text><path d="M478 238H500" class="arrow"/><rect x="510" y="158" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="528" y="175" width="34" height="28" rx="7" fill="#f5ead5"/><text x="535" y="195" font-size="15" fill="#91682f">02</text><text x="574" y="195" font-size="18" fill="#24384c">制定工作计划</text><text x="530" y="225" font-size="15" fill="#536276">• 拆解工作步骤与小组分工</text><text x="530" y="250" font-size="15" fill="#536276">• 确定时间、工具和交付要求</text><path d="M528 283H910" stroke="#e4e1d9"/><text x="530" y="305" font-size="14" fill="#35776b">输出：实施计划与分工表</text><path d="M930 238H952" class="arrow"/><rect x="962" y="158" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="980" y="175" width="34" height="28" rx="7" fill="#f5ead5"/><text x="987" y="195" font-size="15" fill="#91682f">03</text><text x="1026" y="195" font-size="18" fill="#24384c">方案决策</text><text x="982" y="225" font-size="15" fill="#536276">• 比较备选方案与实施条件</text><text x="982" y="250" font-size="15" fill="#536276">• 确认技术路线和验收标准</text><path d="M980 283H1362" stroke="#e4e1d9"/><text x="982" y="305" font-size="14" fill="#35776b">输出：方案与验收清单</text><path d="M1171 317V342" class="arrow"/><rect x="962" y="352" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="980" y="369" width="34" height="28" rx="7" fill="#f5ead5"/><text x="987" y="389" font-size="15" fill="#91682f">04</text><text x="1026" y="389" font-size="18" fill="#24384c">实施与过程记录</text><text x="982" y="419" font-size="15" fill="#536276">• 按计划完成操作与开发</text><text x="982" y="444" font-size="15" fill="#536276">• 记录过程、问题和调整措施</text><path d="M980 477H1362" stroke="#e4e1d9"/><text x="982" y="499" font-size="14" fill="#35776b">输出：项目成果与过程记录</text><path d="M960 432H940" class="arrow"/><rect x="510" y="352" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="528" y="369" width="34" height="28" rx="7" fill="#f5ead5"/><text x="535" y="389" font-size="15" fill="#91682f">05</text><text x="574" y="389" font-size="18" fill="#24384c">检查与质量控制</text><text x="530" y="419" font-size="15" fill="#536276">• 依据验收标准逐项测试</text><text x="530" y="444" font-size="15" fill="#536276">• 定位问题并修改完善</text><path d="M528 477H910" stroke="#e4e1d9"/><text x="530" y="499" font-size="14" fill="#35776b">输出：测试结果与修改记录</text><path d="M508 432H488" class="arrow"/><rect x="58" y="352" width="418" height="158" rx="9" fill="#fffdf9" stroke="#d9d8d1"/><rect x="76" y="369" width="34" height="28" rx="7" fill="#f5ead5"/><text x="83" y="389" font-size="15" fill="#91682f">06</text><text x="122" y="389" font-size="18" fill="#24384c">评价反馈与迁移</text><text x="78" y="419" font-size="15" fill="#536276">• 展示成果，说明实施过程</text><text x="78" y="444" font-size="15" fill="#536276">• 复盘方法并总结改进建议</text><path d="M76 477H458" stroke="#e4e1d9"/><text x="78" y="499" font-size="14" fill="#35776b">输出：成果报告与复盘记录</text><path d="M267 511V525H670V544" class="arrow"/><path d="M550 590L670 550L790 590L670 630Z" fill="#233d51" stroke="#c8aa74"/><text x="601" y="596" font-size="16" fill="#fff6e5">验收是否通过？</text><path d="M792 590H927" class="arrow"/><text x="827" y="578" font-size="14" fill="#a9d9c6">通过</text><rect x="934" y="563" width="280" height="54" rx="27" fill="#2b635b" stroke="#7bb19d"/><text x="973" y="596" font-size="16" fill="#effbf5">提交成果 · 展示与复盘</text><path d="M670 630V655H28V432H49" class="arrow retry"/><text x="140" y="649" font-size="14" fill="#e6bc80">未通过 → 返修完善 → 重新检查</text></svg>